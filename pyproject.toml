[project]
name = "mineru-perf-tool"
version = "1.0.0"
description = "MinerU Performance Testing Tool - Benchmark throughput and accuracy for MinerU"
authors = [{name = "OpenDataLab", email = "opendatalab@example.com"}]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}

dependencies = [
    "click>=8.0.0",
    "loguru>=0.6.0",
    "pyyaml>=6.0",
    "aiohttp>=3.8.0",
    "aiofiles>=0.8.0",
    "psutil>=5.9.0",
    "pandas>=1.5.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "numpy>=1.23.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "mypy>=0.990",
]

npu = [
    "torch-npu>=2.0.0",
]

cuda = [
    "torch>=2.0.0",
]

[project.scripts]
mineru-perf = "mineru_perf_tool.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mineru_perf_tool*"]

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
