# Configuration for OmniDocBench accuracy evaluation mode

# Benchmark settings
benchmark:
  devices: [0]  # Single device for accuracy test
  instances_per_device: 1
  concurrency: 1  # Sequential processing for accuracy
  batch_size: 1
  timeout: 600  # Longer timeout for accuracy evaluation
  
  backend: hybrid-auto-engine
  device_mode: npu
  
  # OmniDocBench mode configuration
  mode: omnidocbench
  omnidocbench_path: null  # Set this to your OmniDocBench directory
  omnidocbench_config: null  # Optional: custom OmniDocBench config
  
  input_dir: null  # Set this to input directory
  output_dir: ./omnidocbench_output
  
  monitor_interval: 1.0
  enable_resource_monitor: false  # Disable for pure accuracy test

# OmniDocBench evaluation settings
evaluation:
  # Matching method
  match_method: quick_match  # Options: quick_match, simple_match, no_split
  
  # Metrics to evaluate
  metrics:
    - Edit_dist  # Normalized edit distance
    - BLEU
    - METEOR
    - TEDS  # For table evaluation
    - CDM  # For formula evaluation
  
  # Components to evaluate
  components:
    - text_block  # Text paragraphs
    - display_formula  # Display formulas
    - table  # Tables
    - reading_order  # Reading order
  
  # Ground truth
  ground_truth_path: null  # Path to OmniDocBench.json
  
# Report settings
report:
  format: json
  include_raw_data: true
  generate_plots: false  # Usually not needed for accuracy evaluation
  output_summary: true  # Output summary statistics
