# Configuration for grid search parameter optimization

# Base benchmark configuration
benchmark:
  devices: [0]  # Will be overridden by grid search
  instances_per_device: 1  # Will be overridden by grid search
  concurrency: 10  # Will be overridden by grid search
  batch_size: 1  # Will be overridden by grid search
  timeout: 300
  
  backend: hybrid-auto-engine
  device_mode: npu
  
  input_dir: null  # Set this to your input directory
  output_dir: ./grid_search_output
  duration: 60  # Duration per test in seconds
  
  monitor_interval: 1.0
  enable_resource_monitor: true

# Grid search parameters
grid_search:
  # Number of devices to test
  devices_range: [1, 2, 4]  # Test with 1, 2, and 4 devices
  
  # Instances per device to test
  instances_per_device_range: [1, 2]  # Test with 1 and 2 instances per device
  
  # Concurrency levels to test
  concurrency_range: [10, 20, 50]  # Test with 10, 20, and 50 concurrent requests
  
  # Batch sizes to test
  batch_size_range: [1, 5, 10]  # Test with 1, 5, and 10 files per batch

# Grid search will test all combinations of the above parameters
# For example: 3 devices × 2 instances × 3 concurrency × 3 batch sizes = 54 test cases

# Optimization settings
optimization:
  metric: qps  # Metric to optimize (qps, avg_latency, success_rate)
  higher_is_better: true  # Whether higher metric values are better
  
  # Early stopping (optional)
  early_stopping: false
  patience: 5  # Number of tests without improvement before stopping
  
# Report settings
report:
  format: json
  include_raw_data: true
  generate_plots: true
  generate_heatmap: true  # Generate parameter heatmap
